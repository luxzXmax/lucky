<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#0f0d0b;
    color:white;
}

.bg-video{
    position:fixed;
    inset:0;
    z-index:-3;
    width:100%;
    height:100%;
    object-fit:cover;
    filter:brightness(.35) contrast(1.05);
}

.overlay{
    position:fixed;
    inset:0;
    z-index:-2;
    background:linear-gradient(90deg, rgba(0,0,0,.85) 0%, rgba(0,0,0,.55) 100%);
}

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    padding:25px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:10;
    background:rgba(0,0,0,.4);
    backdrop-filter:blur(8px);
}

.logo{
    font-size:25px;
    font-weight:bold;
    text-decoration:none;
    color:white;
}

.logo span{
    color:#f2c14e;
}

.back{
    color:white;
    text-decoration:none;
    border:1px solid #f2c14e;
    padding:10px 20px;
    border-radius:8px;
    transition:.3s;
}

.back:hover{
    background:#f2c14e;
}

main{
    padding:140px 8% 80px;
    max-width:1000px;
    margin:auto;
}

h1{
    font-size:clamp(32px,6vw,55px);
    margin-bottom:10px;
}

h1 span{
    color:#f2c14e;
}

.desc{
    color:#cbc2ae;
    max-width:650px;
    line-height:1.8;
    margin-bottom:40px;
}

.empty-note{
    color:#666;
    text-align:center;
    padding:60px 20px;
    border:1px dashed #333;
    border-radius:12px;
}

@media(max-width:700px){
    main{
        padding:120px 6% 60px;
    }
}
</style>
