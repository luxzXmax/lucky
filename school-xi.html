<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com https://www.youtube.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; media-src 'self' blob: https:; connect-src 'self' https: wss:; frame-src https://open.spotify.com https://www.youtube.com https://w.soundcloud.com; object-src 'none'; base-uri 'self'; form-action 'self'">

<title>Kelas XI | FARUQ</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#0f0d0b;
    color:white;
}

.bg-video{
    position:fixed;
    inset:0;
    z-index:-3;
    width:100%;
    height:100%;
    object-fit:cover;
    filter:brightness(.35) contrast(1.05);
}

.overlay{
    position:fixed;
    inset:0;
    z-index:-2;
    background:linear-gradient(90deg, rgba(0,0,0,.85) 0%, rgba(0,0,0,.55) 100%);
}

nav{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    padding:25px 6%;
    display:flex;
    justify-content:space-between;
    align-items:center;
    z-index:10;
    background:rgba(0,0,0,.4);
    backdrop-filter:blur(8px);
}

.logo{
    font-size:25px;
    font-weight:bold;
    text-decoration:none;
    color:white;
}

.logo span{
    color:#f2c14e;
}

.back{
    color:white;
    text-decoration:none;
    border:1px solid #f2c14e;
    padding:10px 20px;
    border-radius:8px;
    transition:.3s;
}

.back:hover{
    background:#f2c14e;
}

main{
    padding:140px 8% 80px;
    max-width:1000px;
    margin:auto;
}

h1{
    font-size:clamp(32px,6vw,55px);
    margin-bottom:10px;
}

h1 span{
    color:#f2c14e;
}

.desc{
    color:#cbc2ae;
    max-width:650px;
    line-height:1.8;
    margin-bottom:40px;
}

.grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:20px;
    max-width:640px;
}

.card{
    padding:30px;
    background:rgba(26,22,18,.8);
    border:1px solid #3a3329;
    border-radius:12px;
    text-decoration:none;
    color:inherit;
    display:block;
    transition:.3s;
}

.card:hover{
    transform:translateY(-6px);
    border-color:#f2c14e;
}

.card .icon{
    font-size:40px;
    margin-bottom:16px;
}

.card h3{
    margin-bottom:8px;
}

.card p{
    color:#a89f8b;
    font-size:14px;
}

@media(max-width:700px){
    .grid{
        grid-template-columns:1fr;
    }
    main{
        padding:120px 6% 60px;
    }
}
</style>
<link rel="stylesheet" href="holo-card.css">
<link rel="stylesheet" href="cubes.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Instrument+Serif:ital@0;1&family=Schibsted+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="tampilan.css">
<link rel="stylesheet" href="page-emblem.css">
</head>
<body>

<!-- WALLPAPER: Cubes (React Bits). Video lama disimpan di bawah sebagai komentar. -->

</video>
-->
<div class="overlay"></div>

<nav>
    <a href="index.html" class="logo">FARUQ<span>.</span></a>
    <a href="index.html#school" class="back">← Kembali</a>
</nav>

<main>

    <h1>Kelas <span>XI</span></h1>

    <p class="desc">
        Pilih semester untuk melihat tugas-tugas sekolah.
    </p>

    <div class="grid">

        <a href="semester3.html" class="card">
            <div class="icon">→</div>
            <h3>Semester 1</h3>
        </a>

        <a href="semester4.html" class="card">
            <div class="icon">→</div>
            <h3>Semester 2</h3>
        </a>

    </div>

</main>

<script src="share-button.js"></script>
<script src="page-emblem.js"></script>
<script src="holo-card.js"></script>
<script src="cubes.js"></script>
<script>
// Wallpaper Cubes (React Bits) — ubah angka di sini untuk menyesuaikan tampilan
window.cubesWallpaper = Cubes(document.getElementById('cubesWallpaper'), {
    gridSize: 10,
    faceColor: '#14110e',
    edgeColor: '#4a4234',
    rippleColor: '#f2c14e',
    maxAngle: 45,
    radius: 3
});
</script>
</body>
</html>
